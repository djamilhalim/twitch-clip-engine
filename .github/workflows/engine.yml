# Dauerbetrieb auf GitHub Actions (kostenlos bei öffentlichem Repo).
# Ein Job läuft ~5,7 Stunden und macht alle 20 Minuten einen Durchlauf. Am Ende startet er
# sich selbst neu (workflow_dispatch). Der Zeitplan unten ist nur Reserve, falls die Kette reißt –
# GitHub startet Zeitpläne bei neuen Repos oft stundenlang nicht.
name: clip-engine

on:
  workflow_dispatch:
  schedule:
    - cron: "17 */2 * * *"

concurrency:
  group: clip-engine
  cancel-in-progress: false

permissions:
  contents: write
  actions: write

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    env:
      TWITCH_CLIENT_ID: ${{ secrets.TWITCH_CLIENT_ID }}
      TWITCH_CLIENT_SECRET: ${{ secrets.TWITCH_CLIENT_SECRET }}
      BUFFER_API_KEY: ${{ secrets.BUFFER_API_KEY }}
      BUFFER_TIKTOK_CHANNEL_ID: ${{ secrets.BUFFER_TIKTOK_CHANNEL_ID }}
      BUFFER_YOUTUBE_CHANNEL_ID: ${{ secrets.BUFFER_YOUTUBE_CHANNEL_ID }}
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
      NOTIFY_DISCORD_WEBHOOK: ${{ secrets.NOTIFY_DISCORD_WEBHOOK }}
      DURCHLAEUFE: "17"        # 17 × 20 Min ≈ 5,7 h
      PAUSE_S: "1200"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: System-Pakete
        run: sudo apt-get update && sudo apt-get install -y ffmpeg fonts-montserrat

      - run: pip install -r requirements.txt

      - name: Whisper-Modell cachen
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: whisper-small

      - name: Dauerbetrieb
        run: |
          if [ -z "$TWITCH_CLIENT_ID" ] || [ -z "$BUFFER_API_KEY" ]; then
            echo "::warning::Secrets fehlen – Lauf übersprungen"; exit 0
          fi
          test -f config.yaml || cp config.example.yaml config.yaml
          git config user.name "clip-engine"
          git config user.email "clip-engine@users.noreply.github.com"
          for i in $(seq 1 "$DURCHLAEUFE"); do
            echo "::group::Durchlauf $i/$DURCHLAEUFE ($(date -u +%H:%M) UTC)"
            # neueste Einstellungen/Zustand holen (Änderungen aus dem Repo greifen sofort)
            git pull -q --rebase origin main || true
            python -m engine once || echo "::warning::Durchlauf $i fehlgeschlagen"
            git add data/state.json || true
            git diff --cached --quiet || git commit -q -m "state: $(date -u +%FT%TZ)"
            git pull -q --rebase origin main || true
            git push -q || true
            echo "::endgroup::"
            [ "$i" -lt "$DURCHLAEUFE" ] && sleep "$PAUSE_S"
          done

      - name: Nächsten Dauerlauf starten
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run engine.yml --ref main -R "${{ github.repository }}"
